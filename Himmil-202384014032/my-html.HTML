
<!--Himmil-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himmil's Project</title>
<style>
  :root{
    --cyan:#22d3ee;
    --violet:#a78bfa;
    --pink:#f472b6;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:#05060f;
    color:#e8ecff;
  }

  /* 粒子网络背景 */
  #stars{position:fixed;inset:0;z-index:0;}

  /* 极光光斑 */
  .aurora{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.45;
    z-index:1;
    pointer-events:none;
    animation:float 14s ease-in-out infinite;
  }
  .aurora.a{width:520px;height:520px;background:var(--cyan);top:-140px;left:-120px;}
  .aurora.b{width:460px;height:460px;background:var(--violet);bottom:-160px;right:-100px;animation-delay:-5s;}
  .aurora.c{width:360px;height:360px;background:var(--pink);top:40%;left:55%;opacity:.28;animation-delay:-9s;}

  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(50px,-40px) scale(1.15);}
  }

  /* 鼠标跟随光晕 */
  .cursor-glow{
    position:fixed;
    width:340px;height:340px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(34,211,238,.22),transparent 65%);
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:2;
    transition:opacity .3s;
  }

  /* 卡片 */
  .card{
    position:relative;
    z-index:3;
    width:min(760px,92vw);
    padding:56px 48px;
    border-radius:28px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14);
    text-align:center;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(36px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  /* 渐变标题 */
  h1{
    font-size:clamp(2rem,6vw,3.4rem);
    font-weight:800;
    letter-spacing:-.02em;
    background:linear-gradient(100deg,var(--cyan),var(--violet),var(--pink),var(--cyan));
    background-size:280% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 6s linear infinite;
  }
  @keyframes shine{
    to{background-position:280% 0;}
  }

  /* 打字机 */
  .typing{
    margin-top:14px;
    min-height:1.6em;
    font-size:1.05rem;
    letter-spacing:.02em;
    color:#9fb0d9;
  }
  .cursor-bar{
    display:inline-block;
    width:2px;height:1.05em;
    margin-left:3px;
    vertical-align:-.15em;
    background:var(--cyan);
    box-shadow:0 0 10px var(--cyan);
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* 积分面板 */
  .score{
    margin:38px auto 0;
    max-width:420px;
    padding:24px 28px;
    border-radius:20px;
    background:linear-gradient(145deg,rgba(34,211,238,.12),rgba(167,139,250,.12));
    border:1px solid rgba(255,255,255,.1);
  }
  .score-label{
    font-size:.8rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:#8b9cc4;
  }
  .score-value{
    margin-top:8px;
    font-size:clamp(2.4rem,8vw,3.6rem);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    color:#fff;
    text-shadow:0 0 26px rgba(34,211,238,.8),0 0 60px rgba(167,139,250,.5);
  }
  .score-unit{font-size:1rem;font-weight:600;color:var(--cyan);margin-left:6px;}

  /* 按钮 */
  .actions{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

  .btn{
    position:relative;
    overflow:hidden;
    padding:14px 32px;
    border:none;
    border-radius:999px;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.04em;
    color:#061018;
    background:linear-gradient(120deg,var(--cyan),var(--violet));
    cursor:pointer;
    transition:transform .2s,box-shadow .3s;
    box-shadow:0 10px 30px rgba(34,211,238,.35);
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(167,139,250,.5);}
  .btn:active{transform:translateY(0) scale(.97);}

  .btn.ghost{
    color:#dbe6ff;
    background:transparent;
    border:1px solid rgba(255,255,255,.22);
    box-shadow:none;
  }
  .btn.ghost:hover{border-color:var(--cyan);box-shadow:0 0 24px rgba(34,211,238,.35);}

  /* 点击涟漪 */
  .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.55);
    transform:translate(-50%,-50%) scale(0);
    animation:ripple .6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes ripple{
    to{transform:translate(-50%,-50%) scale(14);opacity:0;}
  }

  /* 漂浮积分粒子 */
  .spark{
    position:fixed;
    width:6px;height:6px;
    border-radius:50%;
    pointer-events:none;
    z-index:4;
    animation:sparkUp 1s ease-out forwards;
  }
  @keyframes sparkUp{
    to{transform:translate(var(--dx),-90px) scale(.2);opacity:0;}
  }

  .footer{
    margin-top:30px;
    font-size:.78rem;
    letter-spacing:.18em;
    color:#5c6b91;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="aurora a"></div>
<div class="aurora b"></div>
<div class="aurora c"></div>
<div class="cursor-glow" id="glow"></div>

<main class="card">
  <h1>Himmil's Project</h1>
  <p class="typing"><span id="type"></span><span class="cursor-bar"></span></p>

  <div class="score">
    <div class="score-label">Total Points</div>
    <div class="score-value"><span id="score">0</span><span class="score-unit">积分</span></div>
  </div>

  <div class="actions">
    <button class="btn" id="addBtn">+ 获得积分</button>
    <button class="btn ghost" id="resetBtn">重置</button>
  </div>

  <div class="footer">HTML · JS · CSS</div>
</main>

<script>
/* ---------- 粒子网络 ---------- */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let w, h, particles = [];
const mouse = { x: -9999, y: -9999 };

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  const count = Math.min(110, Math.floor(w * h / 16000));
  particles = Array.from({length: count}, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: (Math.random() - .5) * .45,
    vy: (Math.random() - .5) * .45,
    r: Math.random() * 1.8 + .6
  }));
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});

function draw(){
  ctx.clearRect(0, 0, w, h);

  for (const p of particles){
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0 || p.x > w) p.vx *= -1;
    if (p.y < 0 || p.y > h) p.vy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(140,200,255,.75)';
    ctx.fill();
  }

  // 连线
  for (let i = 0; i < particles.length; i++){
    for (let j = i + 1; j < particles.length; j++){
      const a = particles[i], b = particles[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130){
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(120,180,255,${(1 - d / 130) * .22})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  // 鼠标吸附连线
  for (const p of particles){
    const d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
    if (d < 180){
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(mouse.x, mouse.y);
      ctx.strokeStyle = `rgba(34,211,238,${(1 - d / 180) * .5})`;
      ctx.stroke();
    }
  }

  requestAnimationFrame(draw);
}
draw();

/* ---------- 打字机 ---------- */
const lines = [
  'Maybe using HTML, or JS, web technologies, TBD',
  'TypeScript · Python · Java · Web Server',
  '积分系统 · 粒子引擎 · 玻璃拟态'
];
const typeEl = document.getElementById('type');
let li = 0, ci = 0, deleting = false;

function typeLoop(){
  const line = lines[li];
  typeEl.textContent = deleting ? line.slice(0, --ci) : line.slice(0, ++ci);

  let delay = deleting ? 40 : 85;

  if (!deleting && ci === line.length){
    delay = 1700;
    deleting = true;
  } else if (deleting && ci === 0){
    deleting = false;
    li = (li + 1) % lines.length;
    delay = 350;
  }
  setTimeout(typeLoop, delay);
}
typeLoop();

/* ---------- 积分 ---------- */
const scoreEl = document.getElementById('score');
let score = 0;

function animateScore(to){
  const from = score;
  score = to;
  const start = performance.now();
  const dur = 420;

  function step(now){
    const t = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    scoreEl.textContent = Math.round(from + (to - from) * eased);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function sparkle(x, y){
  for (let i = 0; i < 12; i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.background = ['#22d3ee', '#a78bfa', '#f472b6'][i % 3];
    s.style.boxShadow = `0 0 10px ${s.style.background}`;
    s.style.setProperty('--dx', (Math.random() - .5) * 140 + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

document.getElementById('addBtn').addEventListener('click', e => {
  animateScore(score + Math.floor(Math.random() * 40) + 10);
  const r = e.currentTarget.getBoundingClientRect();
  sparkle(r.left + r.width / 2, r.top);
});

document.getElementById('resetBtn').addEventListener('click', () => animateScore(0));

/* ---------- 按钮涟漪 ---------- */
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', e => {
    const r = btn.getBoundingClientRect();
    const rp = document.createElement('span');
    rp.className = 'ripple';
    rp.style.left = (e.clientX - r.left) + 'px';
    rp.style.top = (e.clientY - r.top) + 'px';
    rp.style.width = rp.style.height = Math.max(r.width, r.height) + 'px';
    btn.appendChild(rp);
    setTimeout(() => rp.remove(), 600);
  });
});

/* 入场时先加一波积分 */
setTimeout(() => animateScore(520), 700);
</script>
</body>
</html>
